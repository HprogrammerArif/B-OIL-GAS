<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-chairman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="100%" stop-color="#A51C30"/>
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tie-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-circle)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-grad-chairman)"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#FDE047" stroke-width="2.5" opacity="0.4"/>
    
    <!-- Shoulders & Suit -->
    <path d="M14 120 C18 92 36 84 60 84 C84 84 102 92 106 120 Z" fill="url(#suit-grad)"/>
    <!-- Suit Lapels -->
    <path d="M42 84 L53 120 L30 120 Z" fill="#334155"/>
    <path d="M78 84 L67 120 L90 120 Z" fill="#334155"/>
    <!-- White Shirt V -->
    <polygon points="50,84 70,84 60,110" fill="#FFFFFF"/>
    <!-- Gold Silk Tie -->
    <polygon points="57,90 63,90 65,116 60,120 55,116" fill="url(#tie-grad)"/>
    <!-- Gold Lapel Pin -->
    <circle cx="40" cy="98" r="2.5" fill="#FACC15"/>
    
    <!-- Neck -->
    <rect x="52" y="66" width="16" height="22" rx="4" fill="#D4A373"/>
    <path d="M52 74 C56 78 64 78 68 74 L68 84 L52 84 Z" fill="#C58A59" opacity="0.3"/>
    
    <!-- Head / Face -->
    <ellipse cx="60" cy="54" rx="20" ry="23" fill="#D4A373"/>
    
    <!-- Ears -->
    <ellipse cx="39" cy="55" rx="3.5" ry="6" fill="#C58A59"/>
    <ellipse cx="81" cy="55" rx="3.5" ry="6" fill="#C58A59"/>
    
    <!-- Eyes -->
    <ellipse cx="52" cy="52" rx="2.5" ry="1.8" fill="#1E293B"/>
    <ellipse cx="68" cy="52" rx="2.5" ry="1.8" fill="#1E293B"/>
    <!-- Glasses -->
    <rect x="45" y="47" width="13" height="10" rx="3" fill="none" stroke="#D4AF37" stroke-width="1.6"/>
    <rect x="62" y="47" width="13" height="10" rx="3" fill="none" stroke="#D4AF37" stroke-width="1.6"/>
    <line x1="58" y1="51" x2="62" y2="51" stroke="#D4AF37" stroke-width="1.6"/>
    <!-- Eyebrows (dignified silver-grey) -->
    <path d="M47 45 Q53 43 57 46" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M63 46 Q67 43 73 45" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Nose -->
    <path d="M60 52 L58 60 L62 60" stroke="#B27A4B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Mustache & Smile -->
    <path d="M52 64 Q60 67 68 64" stroke="#64748B" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M55 69 Q60 72 65 69" stroke="#9A3412" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Hair (Silver-tinged executive side part) -->
    <path d="M38 52 C37 36 47 28 60 28 C74 28 83 36 82 52 C78 40 70 34 58 35 C48 35 41 42 38 52 Z" fill="#475569"/>
    <!-- Silver streaks -->
    <path d="M44 38 Q56 34 68 36" stroke="#CBD5E1" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M42 44 Q50 38 60 38" stroke="#E2E8F0" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>
  <!-- Outer Ring with Gold Accent -->
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#D4AF37" stroke-width="3"/>
</svg>