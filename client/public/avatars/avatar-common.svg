<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Head 3D Gradient -->
    <radialGradient id="headGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#FFB74D"/>
      <stop offset="85%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>

    <!-- Body / Shoulders 3D Gradient -->
    <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Inner Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Gold Accent Ring -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)"/>
  
  <g clip-path="url(#circleClip)">
    <!-- Ambient Inner Glow -->
    <rect width="120" height="120" fill="url(#innerGlow)"/>

    <!-- 3D Torso / Shoulders -->
    <path d="M18 120 C20 86 38 76 60 76 C82 76 100 86 102 120 Z" 
          fill="url(#bodyGrad)" 
          filter="url(#softShadow)"/>
    
    <!-- Torso Highlight Rim -->
    <path d="M22 118 C28 88 42 80 60 80 C78 80 92 88 98 118" 
          stroke="#7DD3FC" 
          stroke-width="1.8" 
          fill="none" 
          opacity="0.45"/>

    <!-- 3D Neck -->
    <rect x="52" y="62" width="16" height="18" rx="5" fill="#F57C00" opacity="0.85"/>

    <!-- 3D Head Sphere -->
    <circle cx="60" cy="46" r="23" fill="url(#headGrad)" filter="url(#softShadow)"/>
    
    <!-- Specular Highlight on Head (3D Gloss Effect) -->
    <ellipse cx="52" cy="36" rx="8" ry="5" fill="#FFFFFF" opacity="0.32" transform="rotate(-25 52 36)"/>
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="60" cy="60" r="57.5" fill="none" stroke="url(#goldRing)" stroke-width="2.5" opacity="0.75"/>
</svg>
