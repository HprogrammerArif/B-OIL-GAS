<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-driver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-circle)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-grad-driver)"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#34D399" stroke-width="2" opacity="0.4"/>
    
    <!-- Driver Uniform with Epaulets -->
    <path d="M14 120 C18 92 36 84 60 84 C84 84 102 92 106 120 Z" fill="#1E293B"/>
    <!-- Epaulets with Gold Bar -->
    <rect x="22" y="96" width="14" height="6" rx="2" fill="#047857"/>
    <rect x="24" y="98" width="10" height="2" fill="#FACC15"/>
    <rect x="84" y="96" width="14" height="6" rx="2" fill="#047857"/>
    <rect x="86" y="98" width="10" height="2" fill="#FACC15"/>
    
    <!-- White Uniform Shirt & Dark Tie -->
    <polygon points="50,84 70,84 60,110" fill="#FFFFFF"/>
    <polygon points="58,92 62,92 63,118 60,120 57,118" fill="#0F172A"/>
    
    <!-- Neck -->
    <rect x="52" y="66" width="16" height="22" rx="4" fill="#BB8558"/>
    
    <!-- Head / Face -->
    <ellipse cx="60" cy="56" rx="19" ry="22" fill="#BB8558"/>
    <ellipse cx="40" cy="57" rx="3.5" ry="6" fill="#A76E43"/>
    <ellipse cx="80" cy="57" rx="3.5" ry="6" fill="#A76E43"/>
    
    <!-- Eyes -->
    <ellipse cx="53" cy="54" rx="2.5" ry="1.8" fill="#0F172A"/>
    <ellipse cx="67" cy="54" rx="2.5" ry="1.8" fill="#0F172A"/>
    
    <!-- Eyebrows -->
    <path d="M48 48 Q53 46 57 49" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M63 49 Q67 46 72 48" stroke="#1E293B" stroke-width="2" fill="none"/>
    
    <!-- Nose & Mustache -->
    <path d="M60 54 L58 61 L62 61" stroke="#8C5329" stroke-width="1.5" fill="none"/>
    <path d="M53 66 Q60 69 67 66" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Driver Peaked Cap -->
    <path d="M38 43 C38 28 48 24 60 24 C72 24 82 28 82 43 Z" fill="#1E293B"/>
    <ellipse cx="60" cy="43" rx="26" ry="6" fill="#0F172A"/>
    <!-- Gold Cap Band & Wheel Badge -->
    <rect x="40" y="38" width="40" height="4" fill="#D4AF37"/>
    <circle cx="60" cy="35" r="4.5" fill="#FACC15"/>
    <circle cx="60" cy="35" r="2.5" fill="#0F172A"/>
  </g>
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#34D399" stroke-width="2.5"/>
</svg>