<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-hod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-circle)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-grad-hod)"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#C084FC" stroke-width="2" opacity="0.4"/>
    
    <!-- Executive Violet Blazer & Silk Top -->
    <path d="M12 120 C16 92 34 84 60 84 C86 84 104 92 108 120 Z" fill="#2E1065"/>
    <path d="M42 84 L52 120 L30 120 Z" fill="#6B21A8"/>
    <path d="M78 84 L68 120 L90 120 Z" fill="#6B21A8"/>
    <polygon points="50,84 70,84 60,108" fill="#FAF5FF"/>
    
    <!-- Neck -->
    <rect x="52" y="66" width="16" height="20" rx="4" fill="#D4A373"/>
    
    <!-- Head / Face -->
    <ellipse cx="60" cy="54" rx="18" ry="21" fill="#D4A373"/>
    <ellipse cx="41" cy="55" rx="3" ry="5.5" fill="#C58A59"/>
    <ellipse cx="79" cy="55" rx="3" ry="5.5" fill="#C58A59"/>
    
    <!-- Eyes -->
    <ellipse cx="53" cy="53" rx="2.5" ry="1.8" fill="#1E293B"/>
    <ellipse cx="67" cy="53" rx="2.5" ry="1.8" fill="#1E293B"/>
    <!-- Glasses -->
    <rect x="46" y="48" width="13" height="9" rx="3" fill="none" stroke="#E9D5FF" stroke-width="1.6"/>
    <rect x="61" y="48" width="13" height="9" rx="3" fill="none" stroke="#E9D5FF" stroke-width="1.6"/>
    <line x1="59" y1="52" x2="61" y2="52" stroke="#E9D5FF" stroke-width="1.6"/>
    
    <!-- Eyebrows -->
    <path d="M48 46 Q53 44 57 47" stroke="#334155" stroke-width="1.8" fill="none"/>
    <path d="M63 47 Q67 44 72 46" stroke="#334155" stroke-width="1.8" fill="none"/>
    
    <!-- Nose & Smile -->
    <path d="M60 53 L59 60 L61 60" stroke="#B27A4B" stroke-width="1.3" fill="none"/>
    <path d="M55 65 Q60 69 65 65" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Hair (Professional Updo / Styled) -->
    <path d="M38 54 C36 36 46 26 60 26 C74 26 84 36 82 54 C78 40 70 32 60 32 C50 32 42 40 38 54 Z" fill="#1E1B4B"/>
