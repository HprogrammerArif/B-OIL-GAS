<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-circle)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-grad-ta)"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#34D399" stroke-width="2" opacity="0.4"/>
    
    <!-- Uniform Shirt / Supervisor Vest -->
    <path d="M14 120 C18 92 36 84 60 84 C84 84 102 92 106 120 Z" fill="#047857"/>
    <!-- Collar -->
    <polygon points="50,84 60,94 70,84 66,80 54,80" fill="#065F46"/>
    <!-- Inner Shirt -->
    <polygon points="54,84 60,92 66,84" fill="#FFFFFF"/>
    <!-- RFID / ID Card Lanyard -->
    <path d="M50 84 L56 120" stroke="#059669" stroke-width="2"/>
    <path d="M70 84 L64 120" stroke="#059669" stroke-width="2"/>
    <rect x="54" y="102" width="12" height="18" rx="2" fill="#FFFFFF" stroke="#065F46" stroke-width="1"/>
    <rect x="56" y="105" width="8" height="5" fill="#3B82F6"/>
    
    <!-- Neck -->
    <rect x="52" y="66" width="16" height="22" rx="4" fill="#D4A373"/>
    
    <!-- Head / Face -->
    <ellipse cx="60" cy="54" rx="19" ry="22" fill="#D4A373"/>
    <ellipse cx="40" cy="55" rx="3.5" ry="6" fill="#C58A59"/>
    <ellipse cx="80" cy="55" rx="3.5" ry="6" fill="#C58A59"/>
    
    <!-- Eyes -->
    <ellipse cx="53" cy="52" rx="2.5" ry="1.8" fill="#1E293B"/>
    <ellipse cx="67" cy="52" rx="2.5" ry="1.8" fill="#1E293B"/>
    <!-- Eyebrows -->
    <path d="M48 46 Q53 44 57 47" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    <path d="M63 47 Q67 44 72 46" stroke="#1E293B" stroke-width="2.2" fill="none"/>
    
    <!-- Nose & Mustache / Trimmed Beard -->
    <path d="M60 52 L58 60 L62 60" stroke="#B27A4B" stroke-width="1.5" fill="none"/>
    <path d="M53 64 Q60 67 67 64" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M56 69 Q60 72 64 69" stroke="#9A3412" stroke-width="1.5" fill="none"/>
    
    <!-- Hair -->
    <path d="M39 50 C38 36 47 28 60 28 C73 28 82 36 81 50 C77 39 69 33 60 34 C50 34 43 40 39 50 Z" fill="#1E293B"/>
  </g>
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#34D399" stroke-width="2.5"/>
</svg>
