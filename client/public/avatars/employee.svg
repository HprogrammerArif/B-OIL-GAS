    <path d="M54 66 Q60 70 66 66" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Modern Quiff / Pompadour Hair -->
    <path d="M38 48 C37 32 46 25 60 25 C74 25 83 32 82 48 C78 36 68 31 58 31 C48 31 41 38 38 48 Z" fill="#0F172A"/>
