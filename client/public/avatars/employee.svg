<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-emp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-circle)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-grad-emp)"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.4"/>
    
    <!-- Smart Casual / Sales Executive Blazer -->
    <path d="M14 120 C18 92 36 84 60 84 C84 84 102 92 106 120 Z" fill="#1E293B"/>
    <!-- Collar & Shirt -->
    <polygon points="50,84 70,84 60,110" fill="#FFFFFF"/>
    <!-- Tie -->
