<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-circle)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-grad-gm)"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
    
    <!-- Engineering High-Vis / Navy Jacket -->
    <path d="M14 120 C18 92 36 84 60 84 C84 84 102 92 106 120 Z" fill="url(#jacket-grad)"/>
    <!-- High-Vis Fluorescent Silver & Neon Stripes -->
    <path d="M26 104 L94 104" stroke="#FDE047" stroke-width="4"/>
    <path d="M24 109 L96 109" stroke="#E2E8F0" stroke-width="2.5"/>
    <!-- Collar & Zip -->
    <polygon points="52,84 68,84 60,98" fill="#F8FAFC"/>
    <line x1="60" y1="98" x2="60" y2="120" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Neck -->
    <rect x="52" y="66" width="16" height="22" rx="4" fill="#BB8558"/>
    
    <!-- Head / Face -->
    <ellipse cx="60" cy="56" rx="19" ry="22" fill="#BB8558"/>
    <ellipse cx="40" cy="57" rx="3.5" ry="6" fill="#A76E43"/>
    <ellipse cx="80" cy="57" rx="3.5" ry="6" fill="#A76E43"/>
    
    <!-- Eyes -->
    <ellipse cx="53" cy="54" rx="2.5" ry="1.8" fill="#0F172A"/>
    <ellipse cx="67" cy="54" rx="2.5" ry="1.8" fill="#0F172A"/>
    <!-- Safety Glasses Frame -->
    <rect x="46" y="49" width="13" height="9" rx="2" fill="none" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="61" y="49" width="13" height="9" rx="2" fill="none" stroke="#0284C7" stroke-width="1.8"/>
    <line x1="59" y1="53" x2="61" y2="53" stroke="#0284C7" stroke-width="1.8"/>
    
    <!-- Eyebrows -->
    <path d="M48 47 Q53 45 57 48" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M63 48 Q67 45 72 47" stroke="#1E293B" stroke-width="2" fill="none"/>
    
    <!-- Nose & Mustache -->
    <path d="M60 54 L58 61 L62 61" stroke="#8C5329" stroke-width="1.5" fill="none"/>
    <path d="M53 66 Q60 69 67 66" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- White Safety Hard Hat (Plant GM) -->
    <path d="M37 45 C37 28 47 22 60 22 C73 22 83 28 83 45 Z" fill="#F8FAFC"/>
    <!-- Hat Brim -->
    <ellipse cx="60" cy="45" rx="26" ry="6" fill="#E2E8F0"/>
    <ellipse cx="60" cy="44" rx="25" ry="5" fill="#FFFFFF"/>
    <!-- BOGCL Plant Safety Crest on Hat -->
    <rect x="56" y="27" width="8" height="9" rx="1.5" fill="#0284C7"/>
    <polygon points="60,29 63,33 57,33" fill="#FDE047"/>
  </g>
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
</svg>