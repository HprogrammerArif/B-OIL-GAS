<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-hr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="hijab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-circle)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-grad-hr)"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.4"/>
    
    <!-- Professional Blazer & Scarf -->
    <path d="M12 120 C16 92 34 84 60 84 C86 84 104 92 108 120 Z" fill="#1E293B"/>
    <!-- Deep Berry Lapels -->
    <path d="M42 84 L52 120 L30 120 Z" fill="#9D174D"/>
    <path d="M78 84 L68 120 L90 120 Z" fill="#9D174D"/>
    <polygon points="50,84 70,84 60,110" fill="#FDF2F8"/>
    <!-- Pearl Necklace -->
    <ellipse cx="60" cy="94" rx="8" ry="4" fill="none" stroke="#FCE7F3" stroke-width="2.5" stroke-dasharray="3,2"/>
    
    <!-- Neck -->
    <rect x="52" y="66" width="16" height="20" rx="4" fill="#C58A59"/>
    
    <!-- Hijab Underlayer / Drapes -->
    <path d="M30 68 C30 42 42 30 60 30 C78 30 90 42 90 68 C90 86 82 96 60 96 C38 96 30 86 30 68 Z" fill="url(#hijab-grad)"/>
    <path d="M35 78 C35 94 48 106 60 106 C72 106 85 94 85 78 Z" fill="#831843"/>
    
    <!-- Face Oval -->
    <ellipse cx="60" cy="58" rx="16.5" ry="19" fill="#D4A373"/>
    
    <!-- Eyes -->
    <ellipse cx="53" cy="56" rx="2.5" ry="1.8" fill="#1E293B"/>
    <ellipse cx="67" cy="56" rx="2.5" ry="1.8" fill="#1E293B"/>
    <!-- Eyelash / liner -->
    <path d="M50 54 Q53 52 56 54" stroke="#0F172A" stroke-width="1.8" fill="none"/>
    <path d="M64 54 Q67 52 70 54" stroke="#0F172A" stroke-width="1.8" fill="none"/>
    <!-- Eyebrows -->
    <path d="M49 50 Q53 48 57 51" stroke="#334155" stroke-width="1.8" fill="none"/>
    <path d="M63 51 Q67 48 71 50" stroke="#334155" stroke-width="1.8" fill="none"/>
    
    <!-- Nose & Smile -->
    <path d="M60 56 L59 62 L61 62" stroke="#B27A4B" stroke-width="1.3" fill="none"/>
    <path d="M55 67 Q60 70 65 67" stroke="#BE185D" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    
    <!-- Gold Brooch on Hijab -->
    <circle cx="38" cy="74" r="3.5" fill="#FACC15"/>
    <circle cx="38" cy="74" r="1.5" fill="#BE185D"/>
  </g>
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#F472B6" stroke-width="2.5"/>
</svg>